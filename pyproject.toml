[project]
name = "call_me_maybe"
author = "gipimpin"
version = "0.1.0"
description = "Function calling with constrained decoding"
requires-python = ">= 3.10"
dependencies = [
    "huggingface-hub>=1.26.1",
    "numpy>=1.24",
    "pydantic>=2.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }